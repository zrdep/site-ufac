<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Aluno UFAC</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="container">

        <!-- CABEÇALHO -->
        <div class="login-header">
            <div class="logo">
                <img src="/site-ufac/login/assents/logo_ufac_transparente.png" alt="logo-ufac" width="50px"
                    height="autocomplete">

            </div>
            <h1>Portal do Aluno</h1>
        </div>


        <div class="box">
            <div class="cpf">
                <label for="cpf" id="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric"><i
                    class="fa-solid fa-user"></i></input>
            </div>

            <div class="senha">
                <label for="senha" id="senha">Senha</label>
                <input type="password" id="senha" placeholder="********"><i class="fa-solid fa-lock"></i><i
                    class="fa-solid fa-eye"></i></input>
            </div>

            <!-- LEMBRAR-ME E ESQUECI SENHA -->
            <div class="options">
                <label class="lembrar">
                    <input type="checkbox" id="lembrar">
                    <span>Lembrar-me</span>
                </label>

                <a href="/site-ufac/login/recuperar_senha.html" class="recuperar_senha">Esqueci minha senha</a>
            </div>

            <!-- BOTÃO -->
            <button type="button"><a href="/site-ufac/dashboard.html">LOGIN</a></button>

        </div>
    </div>

    </div>

</body>

</html>
