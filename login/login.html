<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Aluno UFAC</title>
    <link rel="stylesheet" href="/site-ufac/login/login.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head>

<body>
    <div class="container">
        <img src="/site-ufac/login/assents/logo_ufac_transparente.png" alt="logo-ufac" width="50px" height="autocomplete">
        <h1>Portal do Aluno</h1>

        <div class="box">
            <div class="cpf">
                <label for="cpf" id="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric"><i class="fa-solid fa-user"></i>000.000.000-00</input>
            </div>

            <div class="senha">
                <label for="senha" id="senha">Senha</label>
                <input type="password" id="senha" placeholder="********"><i class="fa-solid fa-lock"></i><i class="fa-solid fa-eye"></i></input>
            </div>

            <div class="lembrar">
                <label class="checkbox">
                    <input type="checkbox">Lembrar-me
                </label>

            </div>

            <div class="recuperar_senha">
                <a href="/site-ufac/login/">Esqueci minha senha</a>
            </div>
        </div>

    </div>


</body>

</html>
