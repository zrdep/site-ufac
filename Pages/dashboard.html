<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Estilos/CSS/Dashboard.css">
    <title>Tela principal</title>
</head>

<body>

    <!-- Container principal -->
    <div class="container">

        <!-- Topo -->
        <div class="topo">

            <div class="Icon_ufac">
                <img src="../Estilos/Icons e img's/logo_ufac_transparente.png">
            </div>

            <div class="header">
                <h1>Portal do Aluno</h1>
                <p>Universidade Federal do Acre</p>
            </div>

        </div>

        <!-- Menu -->
        <div class="menu">

            <div class="card" data-page="perfil.html">
                <img src="../Estilos/Icons e img's/perfil.png">
                <span>Perfil</span>
            </div>

            <div class="card" data-page="rest.html">
                <img src="../Estilos/Icons e img's/ru.png">
                <span>RU</span>
            </div>

            <div class="card" data-page="Documento.html">
                <img src="../Estilos/Icons e img's/documento.png">
                <span>Documentos</span>
            </div>

            <div class="card" data-page="Disciplina.html">
                <img src="../Estilos/Icons e img's/disiplina.png">
                <span>Disciplina</span>
            </div>

            <div class="card" data-page="biblioteca.html">
                <img src="../Estilos/Icons e img's/biblioteca.png">
                <span>Biblioteca</span>
            </div>

            <div class="card" data-page="index.html">
                <img src="../Estilos/Icons e img's/notícia.png">
                <span>Notícia</span>
            </div>

        </div>

    </div>

    <script src="../Script/Dashboard.js"></script>

</body>

</html>
