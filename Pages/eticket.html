<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento RU - UFAC</title>
    <link rel="stylesheet" href="../Estilos/CSS/ticket.css">
</head>

<body>

    <div class="container">
        <div class="topo">

            <div class="Icon_ufac">
                <img src="../Estilos/Icons e img's/logo_ufac_transparente.png" alt="Logo UFAC">
            </div>

            <div class="header">
                <h1>Restaurante Universitário</h1>
                <p>Universidade Federal do Acre</p>
            </div>

        </div>

        

        <div class="saldo-box">
            <p>Seu Saldo Atual</p>
            <h2>R$ 1,00</h2>
            <button class="btn-recarga">Recarregar Saldo</button>
        </div>

        <div class="qr-box">
            <p class="qr-titulo">Seu E-Ticket</p>
            <img src="../Estilos/Icons e img's/QR.png" alt="pagamento">
            <p class="texto">Apresente este código no leitor do RU</p>
        </div>

        <div class="acoes" data-page="dashboard.html">
            <button class="botao-secundario"><a href="rest.html">Voltar</a></button>
        </div>
    </div>
    <script src="../Script/Dashboard.js"></script>
</body>
</html>
