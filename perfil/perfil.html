<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - UFAC</title>
    <link rel="stylesheet" href="/global/global.css">
    <link rel="stylesheet" href="perfil.css">
</head>
<body>
    <h1>Olá, <span class="nome-aluno">Nome do Aluno</span> 👋</h1> 
    <p class="curso-aluno">Curso: <span>Sistema de Informação</span></p>

    <div class="dashboard-perfil">
        <div class="card-informativo">
            <div class="icone-periodo">
                <i class="icon">📖</i>
            </div>
            <div class="info-card">
                <p>Período Atual</p>
                <h2 class="valor">2024.1</h2>
                <p>2º Período</p>
            </div>
        </div>

        <div class="card-informativo">
            <div class="icone-matriculas">
                <i class="icon">📅</i>
            </div>
            <div class="info-card">
                <p>Matrículas</p>
                <h2 class="valor">5</h2>
                <p>Disciplinas</p>
            </div>
        </div>

        <div class="card-informativo">
            <div class="icone-coeficiente">
                <i class="icon">⭐</i>
            </div>
            <div class="info-card">
                <p>Coeficiente de Rendimento</p>
                <h2 class="valor">8,27</h2>
                <p>Bom</p>
            </div>
        </div>

        <div class="card-informativo">
            <div class="icone-situacao">
                <i class="icon">📊</i>
            </div>
            <div class="info-card">
                <p>Situação Acadêmica</p>
                <h2 class="valor">Regular</h2>
                <p>Ativa</p>
            </div>
        </div>
    </div>
</body>
</html>
