<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tela principal</title>
</head>

<body>
<!-- Container principal -->
    <div class="container">
<!-- Topo do container principal -->
        <div class="topo">
<!-- Icone da UFAC -->
            <div class="Icon_ufac">
                <img src="../login/assents/logo_ufac_transparente.png">
            </div>
<!-- Texto ao lado do icone -->
            <div class="header">
                <h1>Portal do Aluno</h1>
                <p>Universidade Federal do Acre</p>
            </div>

        </div>
<!-- Menu -->   
        <div class="menu">

            <div class="card">
                <img src="/Dashboard/img's/perfil.png">
                <span>Perfil</span>
            </div>

            <div class="card">
                <img src="/Dashboard/img's/ru.png">
                <span>RU</span>
            </div>

            <div class="card">
                <img src="/Dashboard/img's/documento.png">
                <span>Documentos</span>
            </div>

            <div class="card">
                <img src="/Dashboard/img's/disiplina.png">
                <span>Disciplina</span>
            </div>

            <div class="card">
                <img src="/Dashboard/img's/biblioteca.png">
                <span>Biblioteca</span>
            </div>

            <div class="card">
                <img src="/Dashboard/img's/notícia.png">
                <span>Notícia</span>
            </div>

        </div>

    </div>

</body>

</html>
