<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante Universitário - UFAC</title>
    <link rel="stylesheet" href="rest.css">
</head>

<body>



    <!-- Container principal -->
    <div class="container">

            <div class="navegacao">
            <a href="/Dashboard/dashboard.html" class="voltar">← Voltar para a Dashboard</a>
            </div>

        <!-- Topo -->
        <div class="topo">

            <div class="Icon_ufac">
                <img src="../login/assents/logo_ufac_transparente.png" alt="Logo UFAC">
            </div>

            <div class="header">
                <h1>Restaurante Universitário</h1>
                <p>Universidade Federal do Acre</p>
            </div>

        </div>

        <!-- Menu -->
        <div class="menu">

            <div class="card">
                <img src="ticket.png" alt="Comprar">
                <span><a href="/RU/eticket.html">E-Ticket</a></span>
            </div>

            <div class="card">
                <img src="card.png" alt="Cardápio">
                <span><a href="/RU/cardapio.html">Cardápio</a></span>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <h3>Horário de funcionamento do RU</h3>
            <ul>
                <li><strong>Café:</strong> 07:00 às 09:00</li>
                <li><strong>Almoço:</strong> 11:00 às 14:00</li>
                <li><strong>Janta:</strong> 17:00 às 19:00</li>
            </ul>
        </footer>

    </div>

</body>
</html>
