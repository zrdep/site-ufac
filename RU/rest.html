<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante Universitário - UFAC</title>
    <link rel="stylesheet" href="rest.css">
    
</head>

<body>

    <!-- CONTAINER DO HEADER -->
    <div class="container header-container">
        <header>
            <img src="logo_ufac_transparente.png" alt="Logo da UFAC">
            <div class="titulo">
                <h1>RESTAURANTE UNIVERSITÁRIO</h1>
               
            </div>
        </header>
    </div>

    <!-- CONTAINER DO CONTEÚDO PRINCIPAL -->
    <div class="container main-container">
        <section class="menu">
            <!--img class="img-med" src="restaurante.png" alt="restaurante"-->
            <div class="item">
                <img src="ticket.png" alt="comprar">
                <span>e-Tickt</span>
            </div>

            <div class="item">
                <img src="card.png" alt="cardápio">
                <span>Cardápio</span>
            </div>

            <div class="item">
                <img src="news.png" alt="notícias">
                <span>Notícias</span>
            </div>

            <div class="item">
                <img src="tempo.png" alt="Fila Estimada">
                <span>Fila Estimada</span>
            </div>
        </section>
    </div>

    <!-- CONTAINER DO FOOTER -->
    <div class="container footer-container">
        <footer>
            <h3>Horário de funcionamento do RU</h3>
            <ul>
                <li><strong>Café:</strong> 07:00 às 09:00</li>
                <li><strong>Almoço:</strong> 11:00 às 14:00</li>
                <li><strong>Janta:</strong> 17:00 às 19:00</li>
            </ul>
        </footer>
    </div>

</body>

</html>
